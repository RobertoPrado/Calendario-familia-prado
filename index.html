<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendário Família Prado</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 40px; display: grid; place-items: center; min-height: 100vh; background: #0f172a; color: #e2e8f0; }
    .card { max-width: 720px; width: 100%; background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { margin: 0; font-size: 1.1rem; opacity: .85; }
    .tag { display: inline-block; margin-top: 16px; padding: 6px 10px; border-radius: 999px; background: #1f2937; border: 1px solid #374151; font-size: .9rem; }
  </style>
</head>
<body>
  <script>
    (function(){
      const senha = "251914";
      const tentativa = prompt("Acesso restrito. Digite a senha:");
      if (tentativa !== senha) {
        document.body.innerHTML = "";
        alert("Senha incorreta.");
        return;
      }
    })();
  </script>
  <div class="card">
    <h1>Calendário Família Prado</h1>
    <p>Portal em construção. Este é um teste de acesso externo.</p>
    <span class="tag">Versão de teste</span>
  </div>
</body>
</html>
